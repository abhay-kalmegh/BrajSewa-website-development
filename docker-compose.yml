services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brajsewa}
      POSTGRES_USER: ${POSTGRES_USER:-brajsewa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment: &backend_env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}      # separate from DJANGO_SECRET_KEY
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      # Secure by default. Plain-HTTP local runs get their opt-outs from docker-compose.override.yml, which is
      # merged automatically by `docker compose up` on a dev machine and must NOT be deployed.
      DJANGO_HTTPS_ONLY: ${DJANGO_HTTPS_ONLY:-true}
      DJANGO_ALLOW_INSECURE_HTTP: ${DJANGO_ALLOW_INSECURE_HTTP:-false}
      RAZORPAY_ALLOW_TEST_KEYS: ${RAZORPAY_ALLOW_TEST_KEYS:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}      # empty: only the Next.js server calls Django
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      API_NUM_PROXIES: ${API_NUM_PROXIES:-1}      # Next.js is the single proxy in front of Django
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DB: ${POSTGRES_DB:-brajsewa}
      POSTGRES_USER: ${POSTGRES_USER:-brajsewa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully   # schema is up to date before any web process starts
    ports:
      - "127.0.0.1:8000:8000"   # loopback only; remove entirely once a reverse proxy fronts the stack

  # One-shot release step: apply database migrations once, then exit. Migrations must be backward compatible with the
  # code that is still running during a rolling deploy (expand first, contract in a later release).
  migrate:
    build:
      context: ./backend
    restart: "no"
    environment:
      <<: *backend_env
      # Migrations run as the schema OWNER (DDL); the web process uses the lower-privileged app role.
      # If MIGRATE_* are unset they fall back to the app role, which is fine for local development only.
      POSTGRES_USER: ${MIGRATE_POSTGRES_USER:-${POSTGRES_USER:-brajsewa}}
      POSTGRES_PASSWORD: ${MIGRATE_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}}
    command: ["python", "manage.py", "migrate", "--noinput"]
    healthcheck:
      disable: true   # not a server
    depends_on:
      db:
        condition: service_healthy

  # Releases stock held by unpaid orders (see shop/management/commands/expire_orders.py).
  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend_env
    command: ["sh", "-c", "while true; do python manage.py expire_orders --minutes 30; sleep 300; done"]
    healthcheck:
      disable: true   # this container does not serve HTTP
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:      # baked in at build time; changing them needs `docker compose build frontend`
        CSP_ENFORCE: ${CSP_ENFORCE:-false}
        CSP_REPORT_URI: ${CSP_REPORT_URI:-}
        HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-3600}
        HSTS_INCLUDE_SUBDOMAINS: ${HSTS_INCLUDE_SUBDOMAINS:-false}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side only. The browser never talks to Django directly.
      API_INTERNAL_URL: http://backend:8000
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Auth cookies carry the Secure flag by default. The production server refuses to start handing out insecure
      # ones unless ALLOW_INSECURE_COOKIES=true (set only by the dev override).
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      ALLOW_INSECURE_COOKIES: ${ALLOW_INSECURE_COOKIES:-false}
      IMAGE_HOSTS: ${IMAGE_HOSTS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
