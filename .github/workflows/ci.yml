name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can read the repository and nothing else unless they say otherwise.
permissions:
  contents: read

# Third-party actions below are referenced by version tag for readability. Dependabot (.github/dependabot.yml) keeps them
# current; pin each to a full commit SHA if your policy requires immutable references.

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # scan the whole history, not just the tip
      - run: pip install pyyaml
      # Discovery, not a hand-written list: a new tests/test_*.py file can never be silently left out of CI.
      - run: python3 -m unittest discover -s tests -t . -p 'test_*.py' -v
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck                  # type errors now fail the build
      # Every tests/*.test.ts, with tsx pinned to an exact version (an unpinned `npx tsx` runs whatever is newest in a job
      # that has repository access). The loop stops at the first failing file.
      - run: |
          set -e
          for f in tests/*.test.ts; do echo "== $f"; npx --yes tsx@4.21.0 "$f"; done
      - run: pnpm audit --prod --audit-level high
      - run: pnpm build
        env:
          API_INTERNAL_URL: http://localhost:8000

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: test, POSTGRES_USER: test, POSTGRES_PASSWORD: test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789-abcdefghij-klmnopqrst
      JWT_SIGNING_KEY: ci-only-another-not-real-key-9876543210-zyxwvutsrq-ponmlkjihg
      DJANGO_HTTPS_ONLY: 'false'
      DJANGO_ALLOW_INSECURE_HTTP: 'true'     # CI talks plain HTTP to its test client
      RAZORPAY_ALLOW_TEST_KEYS: 'true'
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pip-audit
      - run: python manage.py makemigrations --check --dry-run   # fails if models and migrations drift
      - run: python manage.py test
      - run: pip-audit -r requirements.txt

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies, configuration and secrets in the source tree
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, context: ., file: Dockerfile }
          - { name: api, context: backend, file: backend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: brajsewa-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan the built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: brajsewa-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
