name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # scan the whole history, not just the tip
      - run: pip install pyyaml
      - run: python3 -m unittest tests.test_repo_hygiene tests.test_release_config
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck                  # type errors now fail the build
      - run: npx --yes tsx tests/cart-logic.test.ts   # cart reconciliation, stored-cart parsing, price helpers
      - run: pnpm build
        env:
          API_INTERNAL_URL: http://localhost:8000

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: test, POSTGRES_USER: test, POSTGRES_PASSWORD: test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789-abcdefghij-klmnopqrst
      JWT_SIGNING_KEY: ci-only-another-not-real-key-9876543210-zyxwvutsrq-ponmlkjihg
      DJANGO_HTTPS_ONLY: 'false'
      DJANGO_ALLOW_INSECURE_HTTP: 'true'     # CI talks plain HTTP to its test client
      RAZORPAY_ALLOW_TEST_KEYS: 'true'
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pip-audit
      - run: python manage.py makemigrations --check --dry-run   # fails if models and migrations drift
      - run: python manage.py test
      - run: pip-audit -r requirements.txt
